# Every outside resource the site links to lives here — enter each one once.
#
#   id        unique slug (used by <ResourceList ids={[...]} />)
#   title     what the reader will click
#   url       full link
#   source    person or organization behind it
#   kind      Website | Video | Book | Article | Podcast | Course
#   topics    one or more of: history, philosophy, objections, bible, gospel
#   featured  true = shown on "Where to start" (keep that list short)
#   note      one sentence on why it's worth the reader's time

- id: habermas
  title: Minimal Facts and the Resurrection
  url: https://www.garyhabermas.com/
  source: Gary Habermas
  kind: Website
  topics: [history]
  featured: true
  note: Decades of research into what scholars, including skeptics, agree about the resurrection.

- id: cold-case
